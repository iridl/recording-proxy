[project]
name = "recording-proxy"
version = "0.1.0"
classifiers = [
    "Framework :: Pytest",
]
#dependencies = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["recording_proxy.py"]

[project.entry-points.pytest11]
recording-proxy = "recording_proxy"
